# This spec's metadata. drive-spec creates it; each step updates its own entry.
# ⬜ pending · 🔄 in progress · ✅ done · ⏭️ skipped · ⛔ blocked · gate: ⏳ waiting · ✅ user · ✅ auto
spec: <task>
title: <title>
kind: feature               # feature | bug | improvement
size: standard              # light | standard
status: 🔄
current: requirements       # bug: diagnose
branch: <branch | none>
base: <base branch>
gates: ask                  # ask | auto (only when the user said so in advance)
stack: <stack and versions>
atlas: none                 # path to an atlas folder
updated: <yyyy-mm-dd>
folder: <path>/specs/<task>  # where this spec's artifacts sit, from the project root

artifacts:                  # paths inside `folder`; light: design and review point to spec.md
  spec: spec.md
  design: design.md         # unit groups in design/ when needed
  plan: tasks.md
  review: review.md         # written only when the verdict is not accept
  discussions: discussions.md   # only once the user has discussed something
  coverage: coverage.md     # written by spec-check coverage --write

steps:                      # skill: you run it · agent: delegated, with the skills its prompt names
  - id: requirements        # bug → id: diagnose, skill: spec-diagnose, and the two lines below
    skill: spec-requirements
    status: ⬜
    gate: ⏳
    # verdict: none         # valid | needs reproduction | not a bug
    # severity: none        # critical | high | medium | low
  - id: design
    skill: spec-design
    status: ⬜
    gate: ⏳
    review: none            # by spec-design-reviewer, on a yes: accept | accept with fixes | rework
  - id: plan
    skill: spec-plan
    status: ⬜
  - id: test
    agent: spec-tester
    skills: []              # installed skills for this stack and step; yours to edit
    status: ⬜
  - id: implement
    agent: spec-implementer
    skills: []
    status: ⬜
    progress: 0/0           # tasks ✅ / all
  - id: review
    agent: spec-code-reviewer
    skills: []
    status: ⬜
    verdict: none           # accept | accept with fixes | rework
