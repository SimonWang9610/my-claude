# This spec's metadata. drive-spec creates it; each step updates its own entry.
# ⬜ pending · 🔄 in progress · ✅ done · ⏭️ skipped · ⛔ blocked · gate: ⏳ waiting · ✅ user · ✅ auto
spec: <task>
title: <title>
kind: feature
size: standard              # light | standard
status: 🔄
current: requirements
branch: <branch | none>
base: <base branch>
gates: ask                  # ask | auto (only when the user said so in advance)
role: senior (inferred)     # senior | junior, (stated) or (inferred)
stack: <stack and versions>
atlas: none                 # path to an atlas folder
updated: <yyyy-mm-dd>
folder: <path>/specs/<task>  # where this spec's artifacts sit, from the project root

artifacts:                  # paths inside `folder`; light: design and review point to spec.md
  spec: spec.md
  design: design.md
  plan: tasks.md
  review: review.md         # written only when the verdict is not accept
  history: history.md       # created on the first entry: questions, challenges, options rejected
  coverage: coverage.md     # written by spec-check coverage --write

steps:
  - id: requirements
    skill: spec-requirements
    model: session
    skills: []              # - { name: <installed skill>, why: <one line> }
    status: ⬜
    gate: ⏳                # the requirements, before any design
  - id: design
    skill: spec-design
    agent: none             # spec-architect when delegated
    model: strong
    level: none             # module | component | system
    skills: []
    status: ⬜
    gate: ⏳                # the design, after its fresh-eyes review
  - id: plan
    skill: spec-plan
    model: session
    skills: []
    status: ⬜
    gate: none              # ⏳ when teammates will implement
  - id: implement
    skill: spec-implement
    agent: none             # spec-tester, spec-implementer ×<n>
    model: standard         # complex batches run strong
    skills: []
    status: ⬜
    progress: 0/0           # tasks ✅ / all
  - id: review
    skill: spec-review
    agent: spec-reviewer
    model: strong
    skills: []
    status: ⬜
    verdict: none           # accept | accept with fixes | rework
